name = "kodspot-flow-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6c3e32d5c70cfd7299332508a1f1bfad"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.flow.kodspot.co.in", custom_domain = true }]

[observability]
enabled = true

# ─────────────────────────────────────────────────────────────
# Vars (non-secret). For local dev: override via .dev.vars
# Production uses these same values via wrangler deploy.
# ─────────────────────────────────────────────────────────────
[vars]
APP_ENV = "production"
APP_URL = "https://flow.kodspot.co.in"
API_URL = "https://api.flow.kodspot.co.in"
ALLOWED_ORIGINS = "https://flow.kodspot.co.in,http://localhost:3000"

# ─────────────────────────────────────────────────────────────
# D1 — primary database
# ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "kodspot-flow-db"
database_id = "48f3fccd-76f6-4963-b155-546717333655"
migrations_dir = "drizzle"

# ─────────────────────────────────────────────────────────────
# R2 — file storage
# ─────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "PDFS"
bucket_name = "kodspot-flow-pdfs"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "kodspot-flow-assets"

# ─────────────────────────────────────────────────────────────
# KV — sessions / rate limit / idempotency
# ─────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id = "87ad61f8b2f24410ac483f1c821b0ab9"

# ─────────────────────────────────────────────────────────────
# Queues — async jobs
# ─────────────────────────────────────────────────────────────
[[queues.producers]]
binding = "JOBS"
queue = "kodspot-flow-jobs"

[[queues.consumers]]
queue = "kodspot-flow-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "kodspot-flow-jobs-dlq"

# ─────────────────────────────────────────────────────────────
# Durable Objects — atomic invoice numbering per workspace
# ─────────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "INVOICE_COUNTER"
class_name = "InvoiceCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InvoiceCounter"]

# ─────────────────────────────────────────────────────────────
# Browser Rendering — HTML → PDF
# ─────────────────────────────────────────────────────────────
[browser]
binding = "BROWSER"

# ─────────────────────────────────────────────────────────────
# Cron Triggers
# ─────────────────────────────────────────────────────────────
[triggers]
crons = ["0 * * * *", "0 3 * * *"]
