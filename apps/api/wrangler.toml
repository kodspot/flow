name = "kodspot-flow-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6c3e32d5c70cfd7299332508a1f1bfad"

# Custom domain — bound after first deploy
# routes = [{ pattern = "api.flow.kodspot.co.in", custom_domain = true }]

[observability]
enabled = true

# ─────────────────────────────────────────────────────────────
# D1 — primary database
# ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "kodspot-flow-db"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "drizzle"

# ─────────────────────────────────────────────────────────────
# R2 — file storage (PDFs + assets)
# ─────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "PDFS"
bucket_name = "kodspot-flow-pdfs"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "kodspot-flow-assets"

# ─────────────────────────────────────────────────────────────
# KV — sessions / rate limit / idempotency
# ─────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

# ─────────────────────────────────────────────────────────────
# Queues — async jobs (email, whatsapp, recurring)
# ─────────────────────────────────────────────────────────────
[[queues.producers]]
binding = "JOBS"
queue = "kodspot-flow-jobs"

[[queues.consumers]]
queue = "kodspot-flow-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "kodspot-flow-jobs-dlq"

# ─────────────────────────────────────────────────────────────
# Durable Objects — atomic invoice numbering per workspace
# ─────────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name = "INVOICE_COUNTER"
class_name = "InvoiceCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InvoiceCounter"]

# ─────────────────────────────────────────────────────────────
# Browser Rendering — HTML → PDF
# ─────────────────────────────────────────────────────────────
[browser]
binding = "BROWSER"

# ─────────────────────────────────────────────────────────────
# Cron Triggers
#   hourly  — recurring invoice generator
#   daily   — overdue + reminder dispatcher
# ─────────────────────────────────────────────────────────────
[triggers]
crons = ["0 * * * *", "0 3 * * *"]

# ─────────────────────────────────────────────────────────────
# Vars (non-secret). Secrets set via `wrangler secret put`.
# ─────────────────────────────────────────────────────────────
[vars]
APP_ENV = "development"
APP_URL = "http://localhost:3000"
API_URL = "http://localhost:8787"
ALLOWED_ORIGINS = "http://localhost:3000"

[env.production]
name = "kodspot-flow-api"
routes = [{ pattern = "api.flow.kodspot.co.in", custom_domain = true }]

[env.production.vars]
APP_ENV = "production"
APP_URL = "https://flow.kodspot.co.in"
API_URL = "https://api.flow.kodspot.co.in"
ALLOWED_ORIGINS = "https://flow.kodspot.co.in"
